name: Wordamix Selection Matrix

on:
  push:
    paths:
      - 'index.html'
      - 'js/engine.js'
      - 'tests/selection.test.js'
      - '.github/workflows/selection-test.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'js/engine.js'
      - 'tests/selection.test.js'
      - '.github/workflows/selection-test.yml'

jobs:
  selection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/selection.test.js
