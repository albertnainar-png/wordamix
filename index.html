<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Wordamix</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0d12;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
.wrap{width:min(540px,100%);margin:auto;padding:18px}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-size:30px;font-weight:900;letter-spacing:-.06em}
.sub{font-size:12px;color:#9ca3af}
button{font:inherit;color:#fff;background:#151922;border:1px solid #303747;border-radius:12px;font-weight:700}
.primary{padding:11px 14px;background:#26324a;border-color:#7c9cff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stat{text-align:center;background:#151922;border:1px solid #252b36;border-radius:13px;padding:9px}
.stat b{display:block;font-size:20px}.stat span{font-size:10px;color:#9ca3af}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:430px;margin:0 auto;touch-action:none}
.cell{width:100%;aspect-ratio:1;border-radius:14px;background:#151922;border:1px solid #2b3240;font-size:clamp(28px,9vw,44px);font-weight:850;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none;padding:0}
.cell.selected{background:#304264;border-color:#9bb3ff;transform:scale(.94)}
.word{text-align:center;height:38px;margin-top:12px;font-size:24px;font-weight:850;letter-spacing:.08em}
.hint{text-align:center;color:#9ca3af;font-size:11px}
.actions{text-align:center;margin:9px 0}.actions button{padding:9px 14px}
.msg{text-align:center;min-height:20px;color:#aeb6c5;font-size:12px}
.found{margin-top:16px}.found h3{font-size:13px}.list{display:flex;flex-wrap:wrap;gap:6px}.pill{font-size:11px;padding:5px 8px;border-radius:999px;background:#151922;border:1px solid #2b3240}
.footer{text-align:center;color:#667085;font-size:10px;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><div class="brand">WORDAMIX</div><div class="sub">Find words. Build combos. Beat your score.</div></div>
    <button id="new" class="primary">New Round</button>
  </div>
  <div class="stats">
    <div class="stat"><b id="score">0</b><span>SCORE</span></div>
    <div class="stat"><b id="time">60</b><span>SECONDS</span></div>
    <div class="stat"><b id="combo">0</b><span>COMBO</span></div>
  </div>

  <div id="board" class="board">
    <button class="cell" data-i="0"></button><button class="cell" data-i="1"></button><button class="cell" data-i="2"></button><button class="cell" data-i="3"></button>
    <button class="cell" data-i="4"></button><button class="cell" data-i="5"></button><button class="cell" data-i="6"></button><button class="cell" data-i="7"></button>
    <button class="cell" data-i="8"></button><button class="cell" data-i="9"></button><button class="cell" data-i="10"></button><button class="cell" data-i="11"></button>
    <button class="cell" data-i="12"></button><button class="cell" data-i="13"></button><button class="cell" data-i="14"></button><button class="cell" data-i="15"></button>
  </div>

  <div id="word" class="word">&nbsp;</div>
  <div class="hint">Tap adjacent letters to build a word. Tap the last letter again to submit. Swipe also works.</div>
  <div class="actions"><button id="shuffle">Shuffle <span id="shuffleCount">3</span></button><button id="clear">Clear</button></div>
  <div id="msg" class="msg">Find a word of 3+ letters.</div>
  <div class="found"><h3>Words found <span id="count">0</span></h3><div id="list" class="list"></div></div>
  <div class="footer">WORDAMIX • A word game built with HTML, CSS & JavaScript</div>
</div>

<script>
(function(){
const boardEl=document.getElementById('board');
const cells=[...document.querySelectorAll('.cell')];
const wordEl=document.getElementById('word');
const scoreEl=document.getElementById('score');
const timeEl=document.getElementById('time');
const comboEl=document.getElementById('combo');
const msgEl=document.getElementById('msg');
const listEl=document.getElementById('list');
const countEl=document.getElementById('count');
const newBtn=document.getElementById('new');
const clearBtn=document.getElementById('clear');

const dictionary=new Set('CAT CATS CAR CARD CARE CARED CODE CODES COLD CORD CORE COST DOG DOT DOTS DOOR EAR EARS EAST EAT EATS RATE RATES READ RED RIDE ROAD ROAR ROSE SAND SANE SAVE SCAR SCORE SEA SEAT SIDE SOAR SORT STAR STARE START STONE STORE STORM TONE TOP TREE WORD WORDS WORK WORKS WORLD WORE WORM MIND MINE TIME TIMES TEAM TEAMS GAME GAMES GATE GATES HOME HOMES HOUSE LIGHT NIGHT RIGHT RING RINGS SING SONG SONGS PLAY PLAYER PRAY PRAYER PEACE PLACE PLANE PLANET POINT POWER WATER HEART HEAR HEARD HEAT FIRE FINE FIND FOOD GOOD GOD GOLD GRACE FAITH HOPE LOVE LIVE'.split(' '));

const layouts=[
['S','T','A','R','E','D','O','R','N','G','I','L','M','P','C','E'],
['W','O','R','D','A','M','I','X','S','T','E','P','L','A','Y','N'],
['C','O','D','E','S','T','A','R','G','A','M','E','P','L','A','Y'],
['P','L','A','N','E','T','O','W','E','R','S','T','A','R','C','O']
];

let letters=[];
let selected=[];
let found=new Set();
let score=0,combo=0,time=60,timer=null;
let pointerDown=false,swiping=false;
let shuffles=3;

function adjacent(a,b){
 const ar=Math.floor(a/4),ac=a%4,br=Math.floor(b/4),bc=b%4;
 return Math.max(Math.abs(ar-br),Math.abs(ac-bc))===1;
}
function update(){
 scoreEl.textContent=score;
 comboEl.textContent=combo;
 timeEl.textContent=time;
 wordEl.textContent=selected.map(i=>letters[i]).join('')||'\u00a0';
 cells.forEach((c,i)=>c.classList.toggle('selected',selected.includes(i)));
}
function updateShuffleButton(){
 const btn=document.getElementById('shuffle');
 const count=document.getElementById('shuffleCount');
 btn.disabled=shuffles<=0 || time<=0;
 count.textContent=shuffles;
}
function shuffleBoard(){
 if(time<=0 || shuffles<=0)return;
 shuffles--;
 for(let i=letters.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [letters[i],letters[j]]=[letters[j],letters[i]];
 }
 selected=[];
 activePointer=null;
 swiping=false;
 cells.forEach((c,i)=>{c.textContent=letters[i]});
 msgEl.textContent='Letters shuffled. '+shuffles+' shuffle'+(shuffles===1?'':'s')+' left.';
 update();
 updateShuffleButton();
}
function showFound(){
 countEl.textContent=found.size;
 listEl.innerHTML='';
 [...found].sort().forEach(w=>{
  const s=document.createElement('span');
  s.className='pill';s.textContent=w;listEl.appendChild(s);
 });
}
function clearSelection(message='Selection cleared.'){
 selected=[];swiping=false;update();msgEl.textContent=message;
}
function submit(){
 const w=selected.map(i=>letters[i]).join('');
 selected=[];update();
 if(w.length<3){msgEl.textContent='Words need at least 3 letters.';return;}
 if(found.has(w)){msgEl.textContent='Already found: '+w;return;}
 if(!dictionary.has(w)){msgEl.textContent=w+' is not in the word list.';combo=0;update();return;}
 found.add(w);
 const base=w.length===3?10:w.length===4?25:w.length===5?45:70;
 combo++;
 const points=base+(combo-1)*5;
 score+=points;
 msgEl.textContent='+'+points+'  '+w+(combo>1?'  • combo x'+combo:'');
 update();showFound();
}
function choose(i){
 if(time<=0)return;
 if(selected.length===0){selected=[i];update();return;}
 const last=selected[selected.length-1];
 if(i===last){submit();return;}
 if(adjacent(last,i)&&!selected.includes(i)){
  selected.push(i);update();
 }else{
  msgEl.textContent='Choose an adjacent letter.';
 }
}
function startRound(){
 clearInterval(timer);
 letters=[...layouts[Math.floor(Math.random()*layouts.length)]];
 selected=[];found=new Set();score=0;combo=0;time=60;pointerDown=false;swiping=false;shuffles=3;
 cells.forEach((c,i)=>{c.textContent=letters[i];c.disabled=false});
 msgEl.textContent='Find a word of 3+ letters.';
 update();showFound();updateShuffleButton();
 timer=setInterval(()=>{
  time--;update();updateShuffleButton();
  if(time<=0){
   clearInterval(timer);
   cells.forEach(c=>c.disabled=true);
   msgEl.textContent='Round over! Tap New Round to play again.';
   updateShuffleButton();
  }
 },1000);
}
function cellAt(x,y){
 const el=document.elementFromPoint(x,y);
 return el&&el.closest('.cell');
}
let activePointer=null;
let dragging=false;

function startDrag(e){
 if(time<=0)return;
 activePointer=e.pointerId;
 dragging=true;
 selected=[Number(e.target.dataset.i)];
 boardEl.setPointerCapture?.(e.pointerId);
 update();
}

function dragMove(e){
 if(!dragging||activePointer!==e.pointerId||time<=0)return;
 const c=cellAt(e.clientX,e.clientY);
 if(!c)return;
 const i=Number(c.dataset.i);
 const last=selected[selected.length-1];
 if(i!==last && adjacent(last,i) && !selected.includes(i)){
  selected.push(i);
  update();
 }
}

function endDrag(e){
 if(!dragging||activePointer!==e.pointerId)return;
 dragging=false;
 activePointer=null;
 if(selected.length>=3){
  submit();
 }else{
  selected=[];
  update();
  msgEl.textContent='Drag across at least 3 letters to make a word.';
 }
}

cells.forEach(cell=>{
 cell.addEventListener('pointerdown',e=>{
  e.preventDefault();
  startDrag(e);
 });
 cell.addEventListener('pointermove',e=>{
  e.preventDefault();
  dragMove(e);
 });
});

document.addEventListener('pointermove',e=>{
 if(dragging)dragMove(e);
},{passive:false});

document.addEventListener('pointerup',e=>{
 if(dragging)endDrag(e);
});

document.addEventListener('pointercancel',e=>{
 if(dragging)endDrag(e);
});
newBtn.addEventListener('click',startRound);
clearBtn.addEventListener('click',()=>clearSelection());
document.getElementById('shuffle').addEventListener('click',shuffleBoard);
startRound();
})();
</script>
</body>
</html>
