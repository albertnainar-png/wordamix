<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Wordamix</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0d12;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
.wrap{width:min(540px,100%);margin:auto;padding:18px}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-size:30px;font-weight:900;letter-spacing:-.06em}
.sub{font-size:12px;color:#9ca3af}
button{font:inherit;color:#fff;background:#151922;border:1px solid #303747;border-radius:12px;font-weight:700}
.primary{padding:11px 14px;background:#26324a;border-color:#7c9cff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stat{text-align:center;background:#151922;border:1px solid #252b36;border-radius:13px;padding:9px}
.stat b{display:block;font-size:20px}.stat span{font-size:10px;color:#9ca3af}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:500px;margin:0 auto;touch-action:none}
.cell{width:100%;aspect-ratio:1;border-radius:14px;background:#151922;border:1px solid #2b3240;font-size:clamp(28px,9vw,44px);font-weight:850;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none;padding:0}
.cell.selected{background:#304264;border-color:#9bb3ff;transform:scale(.94)}
.word{text-align:center;height:38px;margin-top:12px;font-size:24px;font-weight:850;letter-spacing:.08em}
.hint{text-align:center;color:#9ca3af;font-size:11px}
.actions{text-align:center;margin:9px 0}.actions button{padding:9px 14px}
.msg{text-align:center;min-height:20px;color:#aeb6c5;font-size:12px}
.found{margin-top:16px}.found h3{font-size:13px}.list{display:flex;flex-wrap:wrap;gap:6px}.pill{font-size:11px;padding:5px 8px;border-radius:999px;background:#151922;border:1px solid #2b3240}
.footer{text-align:center;color:#667085;font-size:10px;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><div class="brand">WORDAMIX</div><div class="sub">Find words. Build combos. Beat your score.</div></div>
    <button id="new" class="primary">New Round</button>
  </div>
  <div class="stats">
    <div class="stat"><b id="score">0</b><span>SCORE</span></div>
    <div class="stat"><b id="time">60</b><span>SECONDS</span></div>
    <div class="stat"><b id="combo">0</b><span>COMBO</span></div>
  </div>

  <div id="board" class="board">
    <button class="cell" data-i="0"></button><button class="cell" data-i="1"></button><button class="cell" data-i="2"></button><button class="cell" data-i="3"></button><button class="cell" data-i="4"></button>
    <button class="cell" data-i="5"></button><button class="cell" data-i="6"></button><button class="cell" data-i="7"></button><button class="cell" data-i="8"></button><button class="cell" data-i="9"></button>
    <button class="cell" data-i="10"></button><button class="cell" data-i="11"></button><button class="cell" data-i="12"></button><button class="cell" data-i="13"></button><button class="cell" data-i="14"></button>
    <button class="cell" data-i="15"></button><button class="cell" data-i="16"></button><button class="cell" data-i="17"></button><button class="cell" data-i="18"></button><button class="cell" data-i="19"></button>
    <button class="cell" data-i="20"></button><button class="cell" data-i="21"></button><button class="cell" data-i="22"></button><button class="cell" data-i="23"></button><button class="cell" data-i="24"></button>
  </div>

  <div id="word" class="word">&nbsp;</div>
  <div class="hint">Tap adjacent letters to build a word. Tap the last letter again to submit. Swipe also works.</div>
  <div class="actions"><button id="shuffle">Shuffle <span id="shuffleCount">3</span></button><button id="clear">Clear</button></div>
  <div id="msg" class="msg">Find a word of 3+ letters.</div>
  <div class="found"><h3>Words found <span id="count">0</span></h3><div id="list" class="list"></div></div>
  <div class="footer">WORDAMIX • A word game built with HTML, CSS & JavaScript</div>
</div>

<script>
(function(){
const boardEl=document.getElementById('board');
const cells=[...document.querySelectorAll('.cell')];
const wordEl=document.getElementById('word');
const scoreEl=document.getElementById('score');
const timeEl=document.getElementById('time');
const comboEl=document.getElementById('combo');
const msgEl=document.getElementById('msg');
const listEl=document.getElementById('list');
const countEl=document.getElementById('count');
const newBtn=document.getElementById('new');
const clearBtn=document.getElementById('clear');

const dictionary=new Set('CAT CAR CARD CARE CARED CATS DOG DOT DOOR EAR EAT EAST GAME GAMES GOD GOLD GOOD HEART HOME HOPE LAD LAME LIVE LOVE MIND MINE PLACE PLAN PLAY POWER PRAY PRAYER RAT RATS RATE READ RED REST RESTS RIGHT ROAD ROSE SAND SAVE SCORE SEA SEAT SIDE STAR STARE START STONE STORE STORM TAME TAKE TAKEN TAKES TALE TALES TALL TEAM TIME TIMES TOP TREE WATER WORD WORDS WORK WORLD YOUR'.split(' '));

const layouts=[
['T','A','N','K','S','A','R','E','A','S','L','A','M','E','S','T','A','M','E','D','R','A','T','E','S'],
['C','A','R','E','S','T','A','R','E','S','S','T','A','R','T','P','L','A','Y','S','W','O','R','D','S'],
['L','O','V','E','S','H','O','P','E','A','R','E','A','S','E','A','T','S','T','A','R','T','S','T','O'],
['P','L','A','N','S','P','O','W','E','R','S','T','A','R','S','T','O','N','E','S','G','O','L','D','S']
];

let letters=[];
let selected=[];
let found=new Set();
let score=0,combo=0,time=60,timer=null;
let dictionaryReady=false;
let pointerDown=false,swiping=false;
let shuffles=3;

function adjacent(a,b){
 const ar=Math.floor(a/5),ac=a%5,br=Math.floor(b/5),bc=b%5;
 return Math.max(Math.abs(ar-br),Math.abs(ac-bc))===1;
}
function update(){
 scoreEl.textContent=score;
 comboEl.textContent=combo;
 timeEl.textContent=time;
 wordEl.textContent=selected.map(i=>letters[i]).join('')||'\u00a0';
 cells.forEach((c,i)=>c.classList.toggle('selected',selected.includes(i)));
}
function updateShuffleButton(){
 const btn=document.getElementById('shuffle');
 const count=document.getElementById('shuffleCount');
 btn.disabled=shuffles<=0 || time<=0;
 count.textContent=shuffles;
}
function shuffleBoard(){
 if(time<=0 || shuffles<=0)return;
 shuffles--;
 for(let i=letters.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [letters[i],letters[j]]=[letters[j],letters[i]];
 }
 selected=[];
 activePointer=null;
 swiping=false;
 cells.forEach((c,i)=>{c.textContent=letters[i]});
 msgEl.textContent='Letters shuffled. '+shuffles+' shuffle'+(shuffles===1?'':'s')+' left.';
 update();
 updateShuffleButton();
}
function showFound(){
 countEl.textContent=found.size;
 listEl.innerHTML='';
 [...found].sort().forEach(w=>{
  const s=document.createElement('span');
  s.className='pill';s.textContent=w;listEl.appendChild(s);
 });
}
function clearSelection(message='Selection cleared.'){
 selected=[];swiping=false;update();msgEl.textContent=message;
}
async function loadDictionary(){
 try{
  const res=await fetch('./dictionary.txt',{cache:'no-store'});
  if(!res.ok)throw new Error('Dictionary HTTP '+res.status);
  const text=await res.text();
  const words=text.split(/\s+/).map(w=>w.trim()).filter(w=>/^[A-Z]{3,20}$/.test(w));
  if(words.length<10000)throw new Error('Dictionary too small');
  dictionary.clear();
  words.forEach(w=>dictionary.add(w));
  dictionaryReady=true;
  if(time>0)msgEl.textContent='Dictionary loaded: '+words.length.toLocaleString()+' words.';
 }catch(e){
  dictionaryReady=true;
  if(time>0)msgEl.textContent='Using built-in word list.';
 }
}
function submit(){
 const w=selected.map(i=>letters[i]).join('');
 selected=[];update();
 if(w.length<3){msgEl.textContent='Words need at least 3 letters.';return;}
 if(found.has(w)){msgEl.textContent='Already found: '+w;return;}
 if(!dictionary.has(w)){msgEl.textContent=w+' is not in the word list.';combo=0;update();return;}
 found.add(w);
 const base=w.length===3?10:w.length===4?25:w.length===5?45:70;
 combo++;
 const points=base+(combo-1)*5;
 score+=points;
 msgEl.textContent='+'+points+'  '+w+(combo>1?'  • combo x'+combo:'');
 update();showFound();
}
function choose(i){
 if(time<=0)return;
 if(selected.length===0){selected=[i];update();return;}
 const last=selected[selected.length-1];
 if(i===last){submit();return;}
 if(adjacent(last,i)&&!selected.includes(i)){
  selected.push(i);update();
 }else{
  msgEl.textContent='Choose an adjacent letter.';
 }
}
function startRound(){
 clearInterval(timer);
 letters=[...layouts[Math.floor(Math.random()*layouts.length)]];
 selected=[];found=new Set();score=0;combo=0;time=60;pointerDown=false;swiping=false;shuffles=3;
 cells.forEach((c,i)=>{c.textContent=letters[i];c.disabled=false});
 msgEl.textContent='Find a word of 3+ letters.';
 update();showFound();updateShuffleButton();
 timer=setInterval(()=>{
  time--;update();updateShuffleButton();
  if(time<=0){
   clearInterval(timer);
   cells.forEach(c=>c.disabled=true);
   msgEl.textContent='Round over! Tap New Round to play again.';
   updateShuffleButton();
  }
 },1000);
}
function cellAt(x,y){
 const el=document.elementFromPoint(x,y);
 return el&&el.closest('.cell');
}
let dragging=false;
let activeTouchId=null;
let lastTouchIndex=-1;

function cellFromPoint(x,y){
 let best=-1;
 let bestDist=Infinity;
 cells.forEach((cell,i)=>{
  const r=cell.getBoundingClientRect();
  if(x>=r.left && x<=r.right && y>=r.top && y<=r.bottom){
   best=i;
  }
 });
 return best;
}

function addDraggedCell(i){
 if(i<0)return;
 if(selected.length===0){
  selected=[i];
  update();
  return;
 }
 const last=selected[selected.length-1];
 if(i===last)return;
 if(adjacent(last,i) && !selected.includes(i)){
  selected.push(i);
  update();
 }
}

function startTouch(e){
 if(time<=0)return;
 e.preventDefault();
 const t=e.changedTouches[0];
 activeTouchId=t.identifier;
 dragging=true;
 lastTouchIndex=cellFromPoint(t.clientX,t.clientY);
 selected=lastTouchIndex>=0 ? [lastTouchIndex] : [];
 update();
}

function moveTouch(e){
 if(!dragging || time<=0)return;
 e.preventDefault();

 let t=null;
 for(const touch of e.touches){
  if(touch.identifier===activeTouchId){t=touch;break;}
 }
 if(!t)return;

 const i=cellFromPoint(t.clientX,t.clientY);
 if(i>=0){
  // Every move is evaluated independently, so the player can
  // turn in any direction at any point in the word.
  addDraggedCell(i);
  lastTouchIndex=i;
 }
}

function endTouch(e){
 if(!dragging)return;
 e.preventDefault();

 let foundTouch=false;
 for(const t of e.changedTouches){
  if(t.identifier===activeTouchId){foundTouch=true;break;}
 }
 if(!foundTouch)return;

 dragging=false;
 activeTouchId=null;
 lastTouchIndex=-1;

 if(selected.length>=3){
  submit();
 }else{
  selected=[];
  update();
  msgEl.textContent='Select at least 3 adjacent letters.';
 }
}

function startMouse(e){
 if(time<=0)return;
 e.preventDefault();
 dragging=true;
 lastTouchIndex=cellFromPoint(e.clientX,e.clientY);
 selected=lastTouchIndex>=0 ? [lastTouchIndex] : [];
 update();
}

function moveMouse(e){
 if(!dragging || time<=0)return;
 e.preventDefault();
 const i=cellFromPoint(e.clientX,e.clientY);
 if(i>=0)addDraggedCell(i);
}

function endMouse(){
 if(!dragging)return;
 dragging=false;
 lastTouchIndex=-1;
 if(selected.length>=3)submit();
 else{selected=[];update();}
}

boardEl.addEventListener('touchstart',startTouch,{passive:false});
boardEl.addEventListener('touchmove',moveTouch,{passive:false});
boardEl.addEventListener('touchend',endTouch,{passive:false});
boardEl.addEventListener('touchcancel',endTouch,{passive:false});

boardEl.addEventListener('mousedown',startMouse);
document.addEventListener('mousemove',moveMouse);
document.addEventListener('mouseup',endMouse);
newBtn.addEventListener('click',startRound);
clearBtn.addEventListener('click',()=>clearSelection());
document.getElementById('shuffle').addEventListener('click',shuffleBoard);
startRound();
})();
</script>
</body>
</html>
